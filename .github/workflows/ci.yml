name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep the engine cache deterministic across jobs.
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test (hermetic suite; engine downloads chrome-headless-shell on first run)
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --tests -- -D warnings

      - name: Engine probe
        run: cargo run -p vakd -- doctor
