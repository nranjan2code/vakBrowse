name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} \
              -p vakd -p vakbrowse-api -p vakbrowse-cli -p vakbrowse-mcp

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIR="vakBrowse-${VERSION}-${{ matrix.target }}"
          mkdir -p "$DIR"
          for bin in vakd vak vak-mcp vakd-rest; do
            cp "target/${{ matrix.target }}/release/$bin" "$DIR/"
          done
          cp README.md LICENSE AGENTS.md "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
          shasum -a 256 "$DIR.tar.gz" > "$DIR.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
