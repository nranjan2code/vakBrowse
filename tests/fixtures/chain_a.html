<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The regression test serves this stylesheet slowly over loopback HTTP:
         it is render-blocking, so a click-landed page is unpainted (and
         drops trusted input) until it arrives. -->
    <link rel="stylesheet" href="chain.css" />
    <title>Chain page a</title>
  </head>
  <body>
    <!-- Multi-page pager (quotes.toscrape-style): the Next link sits below
         the fold, pushed there by the stylesheet. -->
    <h1>page a</h1>
    <div class="spacer">content a</div>
    <ul class="pager">
      <li class="next"><a href="chain_b.html">Next</a></li>
    </ul>
  </body>
</html>
