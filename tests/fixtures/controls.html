<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Controls</title></head>
  <body>
    <h1>Shop</h1>
    <h2>Shoes</h2>
    <a href="hello.html" id="a-shoes">Read more</a>
    <h2>Hats</h2>
    <a href="hello.html" id="a-hats">Read more</a>
    <label><input type="checkbox" id="news" checked /> Newsletter</label>
    <label><input type="checkbox" id="terms" /> Terms</label>
    <button id="buy" disabled>Buy</button>
    <input id="q" aria-label="Query" value="hello world" />
    <select id="color" aria-label="Color">
      <option value="r">Red</option>
      <option value="g">Green</option>
    </select>
    <a id="popup" href="hello.html" target="_blank">Open elsewhere</a>
  </body>
</html>
