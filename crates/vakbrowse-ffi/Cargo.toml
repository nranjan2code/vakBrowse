[package]
name = "vakbrowse-ffi"
description = "C ABI shared library for embedding vakBrowse (ctypes/FFI consumers)"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[lib]
name = "vakbrowse_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
vakbrowse-core = { workspace = true }
vakbrowse-server = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = { workspace = true }
